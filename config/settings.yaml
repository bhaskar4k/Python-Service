# Which units to run, and the parameters each one gets.
# Add a new unit by registering it in core/registry.py and adding a section here.

api:
  host: "127.0.0.1"
  port: 8000

units:
  order_sync:
    enabled: true
    # Messages produced by this unit go to the "orders" topic.
    produces: ["orders"]
    cfg:
      interval_seconds: 2.0

  report_gen:
    enabled: true
    # This unit reads from the "orders" topic.
    consumes: ["orders"]
    cfg:
      summary_interval_seconds: 10.0
